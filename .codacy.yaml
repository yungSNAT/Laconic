# Opengrep's subprocess audit rules fire on every test that runs a script, a
# hook or Node with an argument list, so it does not scan tests (tests/ and
# laconic-tools' contract tests); shipped code, scripts and the eval tool are still
# scanned.
engines:
  opengrep:
    exclude_paths:
      - "tests/**"
      - "tools/laconic-tools/src/contracts/**"
