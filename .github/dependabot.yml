version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      # CodeQL refuses a workflow whose init, analyze and upload-sarif steps differ in version.
      codeql-action:
        patterns:
          - "github/codeql-action*"
  # The pinned CLIs behind the load checks; see ci/README.md.
  - package-ecosystem: npm
    directories:
      - /ci/claude-code
      - /ci/pi
    schedule:
      interval: weekly
  # The fuzz targets' libFuzzer bindings; laconic-check itself has no dependencies.
  - package-ecosystem: cargo
    directory: /tools/laconic-check/fuzz
    schedule:
      interval: weekly
  # Coverage for the Codecov upload, pinned by hash in requirements-coverage.txt.
  - package-ecosystem: pip
    directory: /ci
    schedule:
      interval: weekly
