version: 2
# A version update waits until its release is 7 days old, which leaves time for a malicious
# release to be found and pulled first. Cooldown does not delay security updates.
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    groups:
      # CodeQL refuses a workflow whose init, analyze and upload-sarif steps differ in version.
      codeql-action:
        patterns:
          - "github/codeql-action*"
      # One pull request for the week's minor and patch bumps, such as one action's pin in 2 files.
      actions:
        patterns:
          - "*"
        update-types:
          - minor
          - patch
  # The pinned CLIs behind the load checks; see ci/README.md.
  - package-ecosystem: npm
    directories:
      - /ci/claude-code
      - /ci/pi
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
  # The Rust crates' registry dependencies; laconic-check itself has none.
  - package-ecosystem: cargo
    directories:
      - /tools/laconic-check/fuzz
      - /tools/laconic-evals
      - /tools/laconic-tools
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    ignore:
      # laconic-evals pins icu_casemap to 2.3 for Unicode 17 case folding, as Python 3.15's
      # casefold; 2.4 has Unicode 18. Patch releases still arrive.
      - dependency-name: icu_casemap
        update-types:
          - version-update:semver-minor
          - version-update:semver-major
  # Coverage for the Codecov upload, pinned by hash in requirements-coverage.txt.
  - package-ecosystem: pip
    directory: /ci
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
