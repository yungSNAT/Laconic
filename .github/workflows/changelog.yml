name: changelog

# Fails a pull request that changes what ships (the laconic-check crate and its Action, the
# skills, rules, hooks, extensions and plugin manifests) without adding a line to
# CHANGELOG.md. Add one under Unreleased, or apply the skip-changelog label to a change users
# will not notice. Dependabot's pull requests are skipped.
on:
  pull_request:
    types: [opened, edited, synchronize, reopened, labeled, unlabeled]

permissions:
  contents: read

jobs:
  changelog:
    if: ${{ !contains(github.event.pull_request.labels.*.name, 'skip-changelog') && github.event.pull_request.user.login != 'dependabot[bot]' }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Require a changelog line for a shipped change
        uses: yungSNAT/yungSNAT/.github/actions/changelog-line@5cd2765e4c78098b7602809e60830f07373fae44 # main
        with:
          shipped: '^(skills|\.cursor/skills|rules|hooks|extensions|\.opencode|\.claude-plugin|\.codex-plugin|\.agents/plugins)/|^(plugin\.json|package\.json|qwen-extension\.json|kimi\.plugin\.json|gemini-extension\.json|GEMINI\.md|action\.yml|\.pre-commit-hooks\.yaml)$|^tools/laconic-check/(src/|mcp/|action/|Cargo\.(toml|lock)$)|^tools/laconic-tools/src/(main|packages)\.rs$'
          heading: '## [Unreleased]'
