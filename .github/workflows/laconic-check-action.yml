name: laconic-check action

# Runs the composite Action in action.yml on each runner it supports: a clean file passes and a
# seeded fault fails the step.
on:
  pull_request:
    paths:
      - action.yml
      - tools/laconic-check/action/**
      - .github/workflows/laconic-check-action.yml
  push:
    branches: [main]
    paths:
      - action.yml
      - tools/laconic-check/action/**
      - .github/workflows/laconic-check-action.yml

permissions:
  contents: read

jobs:
  action:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: A clean file passes
        uses: ./
        with:
          files: tools/laconic-check/action/tests/clean.md
      - name: A seeded fault fails
        id: fault
        continue-on-error: true
        uses: ./
        with:
          files: tools/laconic-check/action/tests/fault.md
      - name: Check the seeded fault failed the step
        shell: bash
        env:
          OUTCOME: ${{ steps.fault.outcome }}
        run: test "$OUTCOME" = failure
      # Over 32,767 characters of paths, more than one Windows command line holds. A seeded
      # fault sorts first and another last, so each lint call sees one.
      - name: Track enough Markdown files to need 2 lint calls
        shell: bash
        run: |
          mkdir -p many
          for i in $(seq 1 600); do
            cp tools/laconic-check/action/tests/clean.md "many/a-clean-file-with-a-long-name-to-fill-a-command-line-$i.md"
          done
          cp tools/laconic-check/action/tests/fault.md many/0-fault.md
          cp tools/laconic-check/action/tests/fault.md many/z-fault.md
          git add many
          { echo 'MANY<<EOF'; git ls-files many; echo EOF; } >> "$GITHUB_ENV"
      # The released binary may disagree with this checkout's prose, so one rare rule keeps the
      # log short and --warn keeps the step's status to lint's errors.
      - name: With no files, every tracked Markdown file is linted
        uses: ./
        with:
          args: --warn --only weekday
      - name: Findings from different lint calls count against one --max-findings
        id: limit
        continue-on-error: true
        uses: ./
        with:
          files: ${{ env.MANY }}
          args: --max-findings 1
      - name: Check the 2 findings failed the step
        shell: bash
        env:
          OUTCOME: ${{ steps.limit.outcome }}
        run: test "$OUTCOME" = failure
