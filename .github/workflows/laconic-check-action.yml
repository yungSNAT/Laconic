name: laconic-check action

# Runs the composite Action in action.yml on each runner it supports: a clean file passes and a
# seeded fault fails the step. The release workflow calls it once a release is published.
on:
  pull_request:
    paths:
      - action.yml
      - tools/laconic-check/action/**
      - .github/workflows/laconic-check-action.yml
  push:
    branches: [main]
    paths:
      - action.yml
      - tools/laconic-check/action/**
      - .github/workflows/laconic-check-action.yml
  workflow_call:

permissions:
  contents: read

jobs:
  action:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # A version bump in action.yml names a release that is published only after the bump
      # merges, so until then the steps install the latest published release, with a warning.
      # The release workflow's run, on the tag, must find the release action.yml names.
      - name: Choose the release to install
        id: release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version=$(tr -d '\r' < action.yml | sed -n 's/^    default: \([0-9][0-9.]*\)$/\1/p')
          if [[ -z "$version" ]]; then
            echo "::error::cannot read the version input's default from action.yml"
            exit 1
          fi
          if gh release view "laconic-check-v$version" --repo "$GITHUB_REPOSITORY" --json tagName > /dev/null; then
            echo "Testing laconic-check-v$version, which action.yml names."
          elif [[ "$GITHUB_REF" == refs/tags/* ]]; then
            echo "::error::laconic-check-v$version, which action.yml names, is not published"
            exit 1
          else
            latest=$(gh release list --repo "$GITHUB_REPOSITORY" --exclude-drafts --exclude-pre-releases \
              --json tagName --jq '[.[].tagName | select(startswith("laconic-check-v"))][0]')
            echo "::warning::laconic-check-v$version, which action.yml names, is not published yet, so this run tests $latest"
            version=${latest#laconic-check-v}
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
      - name: A clean file passes
        uses: ./
        with:
          version: ${{ steps.release.outputs.version }}
          files: tools/laconic-check/action/tests/clean.md
      - name: A seeded fault fails
        id: fault
        continue-on-error: true
        uses: ./
        with:
          version: ${{ steps.release.outputs.version }}
          files: tools/laconic-check/action/tests/fault.md
      - name: Check the seeded fault failed the step
        shell: bash
        env:
          OUTCOME: ${{ steps.fault.outcome }}
        run: test "$OUTCOME" = failure
      # --json and --sarif change lint's output to one the Action cannot annotate, so lint.sh
      # refuses them before any lint call. A stand-in that exits 0 replaces the binary, so the
      # refusal is lint.sh's whatever options the installed release knows.
      - name: Output formats the Action cannot read are refused
        shell: bash
        run: |
          for arg in --json --sarif; do
            status=0
            out=$(LACONIC_CHECK=true LACONIC_FILES=tools/laconic-check/action/tests/clean.md \
              LACONIC_ARGS="--warn $arg" bash tools/laconic-check/action/lint.sh) || status=$?
            test "$status" -eq 2
            test "$out" = "::error::the Action reads lint's text output, so args cannot include $arg"
          done
      # Over 32,767 characters of paths, more than one Windows command line holds. A seeded
      # fault sorts first and another last, so each lint call sees one.
      - name: Track enough Markdown files to need 2 lint calls
        shell: bash
        run: |
          mkdir -p many
          for i in $(seq 1 600); do
            cp tools/laconic-check/action/tests/clean.md "many/a-clean-file-with-a-long-name-to-fill-a-command-line-$i.md"
          done
          cp tools/laconic-check/action/tests/fault.md many/0-fault.md
          cp tools/laconic-check/action/tests/fault.md many/z-fault.md
          git add many
          { echo 'MANY<<EOF'; git ls-files many; echo EOF; } >> "$GITHUB_ENV"
      # The released binary may disagree with this checkout's prose, so one rare rule keeps the
      # log short and --warn keeps the step's status to lint's errors.
      - name: With no files, every tracked Markdown file is linted
        uses: ./
        with:
          version: ${{ steps.release.outputs.version }}
          args: --warn --only weekday
      - name: Findings from different lint calls count against one --max-findings
        id: limit
        continue-on-error: true
        uses: ./
        with:
          version: ${{ steps.release.outputs.version }}
          files: ${{ env.MANY }}
          args: --max-findings 1
      - name: Check the 2 findings failed the step
        shell: bash
        env:
          OUTCOME: ${{ steps.limit.outcome }}
        run: test "$OUTCOME" = failure
      - name: The same 2 findings pass a --max-findings of 2
        uses: ./
        with:
          version: ${{ steps.release.outputs.version }}
          files: ${{ env.MANY }}
          args: --max-findings 2
      # action.yml documents that args splits at new lines as at spaces; were the 2 lines one
      # option, lint would reject it.
      - name: Options on separate lines are split
        uses: ./
        with:
          version: ${{ steps.release.outputs.version }}
          files: ${{ env.MANY }}
          args: |
            --max-findings
            2
      # Only 170 tracked files, each with a failing finding, whose paths alone pass the Windows
      # limit, so no single lint call can judge their total against --max-findings. They are
      # tracked rather than named in files, as Windows caps an input's environment variable at
      # 32,767 characters too. The index is not restored, so these steps come last.
      - name: Track only 170 files with long paths and a failing finding each
        shell: bash
        run: |
          git rm -r -q --cached .
          mkdir -p faults
          long=$(printf '%0190d' 0 | tr 0 f)
          for i in $(seq 1 170); do
            cp tools/laconic-check/action/tests/fault.md "faults/$long-$i.md"
          done
          git add faults
          test "$(git ls-files | wc -l)" -eq 170
      - name: 170 failing findings pass a --max-findings of 170
        uses: ./
        with:
          version: ${{ steps.release.outputs.version }}
          args: --max-findings 170
      - name: 170 failing findings fail a --max-findings of 169
        id: over
        continue-on-error: true
        uses: ./
        with:
          version: ${{ steps.release.outputs.version }}
          args: --max-findings=169
      - name: Check the 170 findings failed the step
        shell: bash
        env:
          OUTCOME: ${{ steps.over.outcome }}
        run: test "$OUTCOME" = failure
      - name: Allow 170 findings in a project file
        shell: bash
        run: printf 'max-findings = 170\n' > .laconic-check
      - name: The project file's --max-findings counts across the calls
        uses: ./
        with:
          version: ${{ steps.release.outputs.version }}
