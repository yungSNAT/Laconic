name: laconic-check release

# Builds laconic-check for Linux, Windows and macOS, bundles them as an MCP bundle, writes
# the Scoop, Homebrew, winget and MCP Registry manifests for them and packs the Vale style in
# vale/Laconic as a Vale package. A tag such as
# laconic-check-v0.1.0 attests the archives and publishes everything as a GitHub release; a
# manual run attests and uploads artefacts. A PR that changes this workflow, the crate's
# Cargo.toml (a version bump or the release profile), the package manifest writer or the Vale
# style only uploads them, so packaging is tested before the tag.
on:
  push:
    tags: ["laconic-check-v*"]
  pull_request:
    paths:
      - .github/workflows/laconic-check-release.yml
      - tools/laconic-check/Cargo.toml
      - tools/laconic-tools/src/packages.rs
      - tools/laconic-tools/src/vale_style.rs
      - vale/Laconic/**
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    strategy:
      fail-fast: true
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-musl
            binary: laconic-check
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            binary: laconic-check.exe
          - os: macos-latest
            target: aarch64-apple-darwin
            binary: laconic-check
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    defaults:
      run:
        shell: bash
        working-directory: tools/laconic-check
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install the Rust toolchain rust-toolchain.toml pins
        run: rustup toolchain install
      - name: Check the tag matches the crate version
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          version=$(sed -n 's/^version = "\(.*\)"/\1/p' Cargo.toml | head -n 1)
          test "${GITHUB_REF_NAME}" = "laconic-check-v${version}" || {
            echo "::error::Tag ${GITHUB_REF_NAME} does not match Cargo.toml version ${version}"
            exit 1
          }
      - name: Install the musl linker
        if: matrix.target == 'x86_64-unknown-linux-musl'
        run: sudo apt-get update && sudo apt-get install -y musl-tools
      - name: Test and build
        env:
          # A static C runtime, so the Windows binary runs without the VC++ redistributable.
          RUSTFLAGS: ${{ matrix.target == 'x86_64-pc-windows-msvc' && '-C target-feature=+crt-static' || '' }}
        run: |
          rustup target add ${{ matrix.target }}
          cargo test --locked
          cargo build --locked --release --target ${{ matrix.target }}
      # Each archive carries the licence and notices beside the binary.
      - name: Package
        run: |
          name=laconic-check-${{ matrix.target }}
          mkdir -p dist
          cp target/${{ matrix.target }}/release/${{ matrix.binary }} ../../LICENSE ../../NOTICE dist/
          cd dist
          if [ "${{ runner.os }}" = "Windows" ]; then
            7z a "../$name.zip" ${{ matrix.binary }} LICENSE NOTICE > /dev/null
            cd .. && sha256sum "$name.zip" > "$name.zip.sha256"
            members=$(7z l -ba -slt "$name.zip" | tr -d '\r' | sed -n 's/^Path = //p' | sort)
          else
            tar -czf "../$name.tar.gz" ${{ matrix.binary }} LICENSE NOTICE
            cd .. && shasum -a 256 "$name.tar.gz" > "$name.tar.gz.sha256"
            members=$(tar -tzf "$name.tar.gz" | sort)
          fi
          expected=$(printf '%s\n' LICENSE NOTICE ${{ matrix.binary }} | sort)
          if [ "$members" != "$expected" ]; then
            echo "::error::$name must hold exactly LICENSE, NOTICE and ${{ matrix.binary }}; it holds:"
            echo "$members"
            exit 1
          fi
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: laconic-check-${{ matrix.target }}
          path: |
            tools/laconic-check/laconic-check-${{ matrix.target }}.*
          if-no-files-found: error

  packages:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install the Rust toolchain rust-toolchain.toml pins
        run: rustup toolchain install
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          path: dist
          merge-multiple: true
      - name: Bundle the MCP server and write the package manifests
        working-directory: tools/laconic-tools
        run: |
          set -euo pipefail
          version=$(sed -n 's/^version = "\(.*\)"/\1/p' ../laconic-check/Cargo.toml | head -n 1)
          dist="$GITHUB_WORKSPACE/dist"
          bundle="$RUNNER_TEMP/bundle"
          mkdir -p "$bundle/server/linux-x64" "$bundle/server/darwin-arm64" "$bundle/server/win32-x64" "$RUNNER_TEMP/packages"
          tar -xzf "$dist/laconic-check-x86_64-unknown-linux-musl.tar.gz" -C "$bundle/server/linux-x64"
          tar -xzf "$dist/laconic-check-aarch64-apple-darwin.tar.gz" -C "$bundle/server/darwin-arm64"
          unzip -q "$dist/laconic-check-x86_64-pc-windows-msvc.zip" -d "$bundle/server/win32-x64"
          cargo run --locked --quiet -- mcpb-manifest "$version" "$bundle"
          (cd "$bundle" && zip -qr "$RUNNER_TEMP/packages/laconic-check.mcpb" .)
          (cd "$RUNNER_TEMP/packages" && sha256sum laconic-check.mcpb > laconic-check.mcpb.sha256)
          cp "$RUNNER_TEMP/packages/laconic-check.mcpb.sha256" "$dist/"
          cargo run --locked --quiet -- package-manifests "$version" "$dist" "$RUNNER_TEMP/packages"
      # A Vale package is a zip of the style's folder; Vale names the style after the folder.
      - name: Pack the Vale style
        run: |
          set -euo pipefail
          cargo run --locked --quiet --manifest-path tools/laconic-tools/Cargo.toml -- vale-style --check
          (cd vale && zip -qr "$RUNNER_TEMP/packages/Laconic.zip" Laconic)
          (cd "$RUNNER_TEMP/packages" && sha256sum Laconic.zip > Laconic.zip.sha256)
      - name: Generate the SPDX SBOM for laconic-check
        uses: anchore/sbom-action@66cbf4bc1f1c0d2edc94016e65bc221b6bb0ad6c # v0.24.3
        with:
          path: tools/laconic-check
          format: spdx-json
          syft-version: v1.51.0
          output-file: ${{ runner.temp }}/packages/laconic-check.spdx.json
          upload-artifact: false
          upload-release-assets: false
      - name: Hash the SPDX SBOM
        run: |
          set -euo pipefail
          (cd "$RUNNER_TEMP/packages" && sha256sum laconic-check.spdx.json > laconic-check.spdx.json.sha256)
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: laconic-check-packages
          path: ${{ runner.temp }}/packages/*
          if-no-files-found: error

  # Attestations go to the public Sigstore log, so PR runs skip this job.
  attest:
    if: github.event_name != 'pull_request'
    needs: [build, packages]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      id-token: write
      attestations: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          path: dist
          merge-multiple: true
      - uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-path: |
            dist/*.tar.gz
            dist/*.zip
            dist/*.mcpb
      - name: Attest the SPDX SBOM for laconic-check
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-path: |
            dist/laconic-check-*.tar.gz
            dist/laconic-check-*.zip
            dist/laconic-check.mcpb
          sbom-path: dist/laconic-check.spdx.json

  release:
    # A tag push only: a manual run on a tag leaves its artefacts unpublished.
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/')
    needs: [build, packages, attest]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - id: version
        run: echo "version=${GITHUB_REF_NAME#laconic-check-v}" >> "$GITHUB_OUTPUT"
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          path: dist
          merge-multiple: true
      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${GITHUB_REF_NAME}" dist/* \
            --repo "${GITHUB_REPOSITORY}" \
            --title "${GITHUB_REF_NAME}" \
            --notes "Prebuilt laconic-check binaries for Linux (x86_64, static), Windows (x86_64) and macOS (Apple silicon), each with a SHA-256 checksum, an SPDX SBOM (laconic-check.spdx.json) and a build provenance attestation; an MCP bundle (laconic-check.mcpb); Scoop, Homebrew, winget and MCP Registry manifests for them; and Laconic.zip, a Vale package of the rules a regular expression can express (vale/README.md)."

  # The Action's self-test against the release just published. A release made with the
  # workflow's token starts no other workflow, so this job calls it.
  action:
    needs: release
    permissions:
      contents: read
    uses: ./.github/workflows/laconic-check-action.yml

  # The README's Scoop command against the release just published.
  scoop:
    needs: release
    permissions:
      contents: read
    uses: ./.github/workflows/scoop-install.yml
    with:
      version: ${{ needs.release.outputs.version }}
