name: Pi package loads

on:
  pull_request:
    paths:
      - extensions/**
      - skills/**
      - package.json
      - tools/laconic-tools/**
      - ci/pi/**
      - .github/workflows/pi-load-check.yml
  push:
    branches: [main]
    paths:
      - extensions/**
      - skills/**
      - package.json
      - tools/laconic-tools/**
      - ci/pi/**
      - .github/workflows/pi-load-check.yml

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  load:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
      - name: Install Pi
        run: |
          npm ci --ignore-scripts --prefix ci/pi
          echo "$GITHUB_WORKSPACE/ci/pi/node_modules/.bin" >> "$GITHUB_PATH"
      - name: Verify the Pi package, commands, status, and persisted mode
        run: cargo run --locked --quiet --manifest-path tools/laconic-tools/Cargo.toml -- check-pi
