name: plugin branch

# The Claude plugin directory accepts, from an organisation it has not
# verified, skills only under skills/ and only Markdown, text, JSON, YAML and
# image files, so it cannot take main with its hooks, scripts and MCP server.
# `laconic-tools build-plugin-dist` builds the skills-only plugin from the
# checked-out commit and refuses any other file; a pull request runs the build
# and the directory's own validator, and a push to main publishes the build to
# the claude-plugin branch, which the directory listing tracks. The install
# routes on main are unchanged.
on:
  workflow_dispatch:
  pull_request:
    paths:
      - .claude-plugin/**
      - skills/**
      - LICENSE
      - NOTICE
      - docs/plugin-directory-readme.md
      - tools/**
      - ci/claude-code/**
      - .github/workflows/plugin-dist.yml
  # Every push to main runs, without a paths filter: a run skips publishing
  # once main has moved on, so the newer commit's run must always publish.
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # The validator runs here, without write access, so the package it installs
  # never shares a job with the push token.
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Build the plugin
        run: cargo run --locked --quiet --manifest-path tools/laconic-tools/Cargo.toml -- build-plugin-dist "$RUNNER_TEMP/plugin"
      - name: Install Claude Code
        run: |
          # The wrapper needs a postinstall to copy this binary. Install it directly.
          npm ci --ignore-scripts --prefix ci/claude-code
          echo "$GITHUB_WORKSPACE/ci/claude-code/node_modules/@anthropic-ai/claude-code-linux-x64" >> "$GITHUB_PATH"
      # Not --strict: the manifest declares no version on purpose, which the
      # validator reports as a warning; the directory accepts it.
      - name: Validate the plugin as the directory does
        run: claude plugin validate --profile directory "$RUNNER_TEMP/plugin"

  publish:
    needs: validate
    # Only main is published, including on a manual run.
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write # Push the generated claude-plugin branch.
    env:
      BRANCH: claude-plugin
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Build the plugin
        run: cargo run --locked --quiet --manifest-path tools/laconic-tools/Cargo.toml -- build-plugin-dist "$RUNNER_TEMP/plugin"
      # The token reaches only this step, after the build has run. The manifest
      # declares no version, so Claude Code updates on each new commit here.
      - name: Commit the plugin to its branch when it changed
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          export GIT_INDEX_FILE="$RUNNER_TEMP/plugin.index"
          git -c core.autocrlf=false --git-dir="$GITHUB_WORKSPACE/.git" --work-tree="$RUNNER_TEMP/plugin" -C "$RUNNER_TEMP/plugin" add --all --force .
          tree="$(git write-tree)"
          parent=""
          if git ls-remote --exit-code --heads origin "refs/heads/$BRANCH" > /dev/null; then
            git fetch --no-tags --depth=1 origin "refs/heads/$BRANCH"
            parent="$(git rev-parse FETCH_HEAD)"
            if [ "$(git rev-parse "$parent^{tree}")" = "$tree" ]; then
              echo "The plugin is unchanged on $BRANCH at $parent."
              exit 0
            fi
          fi
          # A run for an older main commit must not publish over a newer one.
          if [ "$(git ls-remote origin refs/heads/main | cut -f1)" != "$GITHUB_SHA" ]; then
            echo "::notice::main has moved past $GITHUB_SHA; its own run publishes."
            exit 0
          fi
          commit="$(git -c user.name='github-actions[bot]' \
            -c user.email='41898282+github-actions[bot]@users.noreply.github.com' \
            commit-tree "$tree" ${parent:+-p "$parent"} -m "Build the plugin from $GITHUB_SHA")"
          # Not forced: a branch that moved since the fetch refuses the push.
          auth="$(printf 'x-access-token:%s' "$GH_TOKEN" | base64 -w0)"
          git -c "http.https://github.com/.extraheader=AUTHORIZATION: basic $auth" \
            push origin "$commit:refs/heads/$BRANCH"
          echo "Pushed $commit to $BRANCH."
