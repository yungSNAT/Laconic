name: plugin loads in Claude Code

# Installs the plugin from this checkout into a scratch CLAUDE_CONFIG_DIR and
# fails if it does not reach "enabled". Catches load-layer breakage that
# schema validation misses, e.g. the duplicate hooks declaration in #61.
on:
  pull_request:
    paths:
      - .claude-plugin/**
      - hooks/**
      - skills/**
      - tools/laconic-tools/**
      - .github/ci/claude-code/**
      - .github/workflows/plugin-load-check.yml
  push:
    branches: [main]
    paths:
      - .claude-plugin/**
      - hooks/**
      - skills/**
      - tools/laconic-tools/**
      - .github/ci/claude-code/**
      - .github/workflows/plugin-load-check.yml

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  hook-parity:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Test native hook implementations
        run: cargo test --locked --manifest-path tools/laconic-tools/Cargo.toml contracts::hooks

  load:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install Claude Code
        run: |
          # The wrapper needs a postinstall to copy this binary. Install it directly.
          npm ci --ignore-scripts --prefix .github/ci/claude-code
          echo "$GITHUB_WORKSPACE/.github/ci/claude-code/node_modules/@anthropic-ai/claude-code-linux-x64" >> "$GITHUB_PATH"
      - name: Install the plugin from this checkout into a scratch config
        run: |
          export CLAUDE_CONFIG_DIR="$RUNNER_TEMP/claude-scratch"
          mkdir -p "$CLAUDE_CONFIG_DIR"
          claude plugin marketplace add "$GITHUB_WORKSPACE"
          claude plugin install laconic@laconic
          claude plugin list | tee plugin-list.txt
          grep -q "✔ enabled" plugin-list.txt || {
            echo "::error::plugin failed to load; see claude plugin list output above"
            exit 1
          }
