name: tests

# Runs the repository contract tests in laconic-tools, laconic-check's tests and
# its lint of Laconic's own prose, and laconic-evals' tests with their line coverage;
# and checks the .cursor copy of the skills. The other workflows each
# cover one layer; this catches the rest (OpenCode plugin, manifests, skills, CI
# guards, the evaluation harness, judge and benchmarks in laconic-evals).
on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  unittest:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # unittest is the only required check, so laconic-check's format, lints, tests and prose
      # lint, and the .cursor copy check, block here.
      - name: Format, lint and test laconic-check
        working-directory: tools/laconic-check
        run: |
          cargo fmt --check
          cargo clippy --locked --all-targets -- -D warnings
          cargo test --locked
      # Its test fails when an INSTALL.md snippet differs from rules/laconic.md.
      - name: Format, lint and test laconic-tools
        working-directory: tools/laconic-tools
        run: |
          cargo fmt --check
          cargo clippy --locked --all-targets -- -D warnings
          cargo test --locked
      # laconic-evals' lint test runs this build.
      - name: Build laconic-check
        run: cargo build --locked --manifest-path tools/laconic-check/Cargo.toml
      - name: Format and lint laconic-evals
        working-directory: tools/laconic-evals
        run: |
          cargo fmt --check
          cargo clippy --locked --all-targets -- -D warnings
      - name: Install cargo-llvm-cov
        uses: taiki-e/install-action@cfdb7ed4ccc7c7dce37759eae89dc5674b469b39 # v2.90.3
        with:
          tool: cargo-llvm-cov@0.9.1
      # laconic-evals (the evaluation harness, judge and benchmarks) must keep 100% line
      # coverage. Its lint test runs the laconic-check just built, and its catalogue tests
      # fail on an invalid evals/cases.jsonl.
      - name: Test laconic-evals with line coverage
        working-directory: tools/laconic-evals
        run: |
          rustup component add llvm-tools-preview
          export PATH="$GITHUB_WORKSPACE/tools/laconic-check/target/debug:$PATH"
          cargo llvm-cov --locked --fail-under-lines 100 \
            --lcov --output-path "$GITHUB_WORKSPACE/coverage-codecov.lcov"
      - name: Keep the coverage report for the Codecov upload
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: coverage-codecov
          path: coverage-codecov.lcov
          retention-days: 1
      - name: Lint Laconic's own prose
        working-directory: tools/laconic-check
        run: |
          cargo run --quiet --locked -- lint \
            ../../skills/laconic/SKILL.md ../../skills/laconic-prose/SKILL.md \
            ../../rules/laconic.md ../../README.md ../../INSTALL.md ../../AGENTS.md \
            ../../evals/README.md ../../docs/rules.md
      # The .cursor copy is a real folder, not a symlink, so Windows clones and GitHub ZIP
      # downloads work; it must match skills/, references included.
      - name: Fail if the .cursor copy differs from skills
        run: |
          diff -r skills .cursor/skills || {
            echo "::error::.cursor copy is out of sync. Run: rm -rf .cursor/skills && cp -R skills .cursor/skills"
            exit 1
          }

  # Whether a pull request changes tools/ or this workflow, from the merge commit's first parent.
  changes:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      tools: ${{ steps.diff.outputs.tools }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 2
          persist-credentials: false
      - id: diff
        run: |
          changed=$(git diff --name-only HEAD^1 HEAD)
          if grep -qE '^(tools/|\.github/workflows/tests\.yml$)' <<< "$changed"; then
            echo tools=true >> "$GITHUB_OUTPUT"
          else
            echo tools=false >> "$GITHUB_OUTPUT"
          fi

  # The Cargo tests on Windows and macOS, so a platform failure shows on the PR rather than
  # at release. The tests read the repository's Markdown, which a Windows checkout can give CRLF
  # endings, so Windows runs on every change. macOS checks out the same bytes as Linux, so it runs
  # on main and on pull requests that change tools/ or this workflow. If the changes job fails,
  # both legs run.
  cargo-test:
    name: cargo test (${{ matrix.os }})
    needs: changes
    if: ${{ !cancelled() }}
    strategy:
      fail-fast: false
      matrix:
        os: ${{ fromJSON(needs.changes.outputs.tools == 'false' && '["windows-latest"]' || '["windows-latest","macos-latest"]') }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Test laconic-check
        working-directory: tools/laconic-check
        run: cargo test --locked
      - name: Test laconic-tools
        working-directory: tools/laconic-tools
        run: cargo test --locked
      - name: Test laconic-evals
        working-directory: tools/laconic-evals
        run: cargo test --locked

  # The upload runs apart from the tests so the OIDC token is never available
  # whilst test code runs.
  codecov:
    name: upload coverage to Codecov
    needs: [unittest]
    if: github.event_name == 'push' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # A Codecov outage must not turn the tests badge red.
    continue-on-error: true
    permissions:
      contents: read
      id-token: write # Authenticate the Codecov upload with OIDC; no stored token.
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: coverage-codecov
      - uses: codecov/codecov-action@303a32d7a59b442fa8d48b6a1cc6825c09c847a5 # v7.1.1
        with:
          use_oidc: true
          files: coverage-codecov.lcov
          disable_search: true
          fail_ci_if_error: true
