name: tests

# Runs the repository contract tests in laconic-tools, laconic-check's tests and
# its lint of Laconic's own prose, and the whole Python suite; checks the .cursor
# copy of the skills; and validates the evaluation cases. The other workflows each
# cover one layer; this catches the rest (OpenCode plugin, manifests, skills, CI
# guards, eval tooling, judge, humanise metrics).
on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  unittest:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.x"
      # unittest is the only required check, so laconic-check's format, lints, tests and prose
      # lint, and the .cursor copy check, block here.
      - name: Format, lint and test laconic-check
        working-directory: tools/laconic-check
        run: |
          cargo fmt --check
          cargo clippy --locked --all-targets -- -D warnings
          cargo test --locked
      # Its test fails when an INSTALL.md snippet differs from rules/laconic.md.
      - name: Format, lint and test laconic-tools
        working-directory: tools/laconic-tools
        run: |
          cargo fmt --check
          cargo clippy --locked --all-targets -- -D warnings
          cargo test --locked
      # Without the binary, tests/test_mcp_server.py would skip.
      - name: Build laconic-check
        run: cargo build --locked --manifest-path tools/laconic-check/Cargo.toml
      - name: Lint Laconic's own prose
        working-directory: tools/laconic-check
        run: |
          cargo run --quiet --locked -- lint \
            ../../skills/laconic/SKILL.md ../../skills/laconic-prose/SKILL.md \
            ../../rules/laconic.md ../../README.md ../../INSTALL.md ../../AGENTS.md \
            ../../evals/README.md ../../docs/rules.md
      # The .cursor copy is a real folder, not a symlink, so Windows clones and GitHub ZIP
      # downloads work; it must match skills/, references included.
      - name: Fail if the .cursor copy differs from skills
        run: |
          diff -r skills .cursor/skills || {
            echo "::error::.cursor copy is out of sync. Run: rm -rf .cursor/skills && cp -R skills .cursor/skills"
            exit 1
          }
      # Coverage only records the run for the Codecov badge; no threshold.
      - name: Install coverage
        run: python -m pip install --only-binary=":all:" --require-hashes -r ci/requirements-coverage.txt
      - name: Unit tests
        run: python -m coverage run --source=scripts -m unittest discover -s tests -v
      - name: Write coverage for Codecov
        run: python -m coverage xml -o coverage-codecov.xml
      - name: Keep the coverage report for the Codecov upload
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: coverage-codecov
          path: coverage-codecov.xml
          retention-days: 1
      - name: Validate evaluation cases
        run: python scripts/run_evals.py validate

  # The upload runs apart from the tests so the OIDC token is never available
  # whilst test code runs.
  codecov:
    name: upload coverage to Codecov
    needs: [unittest]
    if: github.event_name == 'push' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # A Codecov outage must not turn the tests badge red.
    continue-on-error: true
    permissions:
      contents: read
      id-token: write # Authenticate the Codecov upload with OIDC; no stored token.
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: coverage-codecov
      - uses: codecov/codecov-action@303a32d7a59b442fa8d48b6a1cc6825c09c847a5 # v7.1.1
        with:
          use_oidc: true
          files: coverage-codecov.xml
          disable_search: true
          fail_ci_if_error: true
