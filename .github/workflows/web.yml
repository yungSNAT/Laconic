name: web

# Builds the browser checker: tools/laconic-web (lint and preserve) as WebAssembly, put into
# web/index.html as one file whose content security policy blocks every request. Tests the
# crate, then opens the page in headless Chromium and checks that it lints and checks its
# sample texts. On main, publishes the page with GitHub Pages once Pages is turned on with
# GitHub Actions as its source; until then the publish job is skipped.
on:
  pull_request:
    paths:
      - .github/workflows/web.yml
      - web/**
      - tools/laconic-web/**
      - tools/laconic-check/src/**
      - tools/laconic-tools/src/web_page.rs
      - tools/laconic-tools/src/web_page/**
  push:
    branches: [main]
    paths:
      - .github/workflows/web.yml
      - web/**
      - tools/laconic-web/**
      - tools/laconic-check/src/**
      - tools/laconic-tools/src/web_page.rs
      - tools/laconic-tools/src/web_page/**
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install the Rust toolchain rust-toolchain.toml pins
        run: |
          rustup toolchain install
          rustup target add wasm32-unknown-unknown
      - name: Format, lint and test laconic-web
        working-directory: tools/laconic-web
        run: |
          cargo fmt --check
          cargo clippy --locked --all-targets -- -D warnings
          cargo test --locked
      - name: Build the page
        run: |
          set -euo pipefail
          cargo build --locked --release --target wasm32-unknown-unknown \
            --manifest-path tools/laconic-web/Cargo.toml
          mkdir -p "$RUNNER_TEMP/site"
          cargo run --locked --quiet --manifest-path tools/laconic-tools/Cargo.toml -- web-page \
            tools/laconic-web/target/wasm32-unknown-unknown/release/laconic_web.wasm \
            "$RUNNER_TEMP/site/index.html"
      # The page runs its sample texts on load; a blocked script or a WebAssembly that fails to
      # load leaves the findings empty.
      - name: Open the page in headless Chromium
        run: |
          set -euo pipefail
          browser=$(command -v chromium || command -v chromium-browser || command -v google-chrome)
          "$browser" --headless=new --disable-gpu --no-sandbox --virtual-time-budget=10000 \
            --dump-dom "file://$RUNNER_TEMP/site/index.html" > "$RUNNER_TEMP/dom.html"
          for wanted in '4 findings' 'us-spelling' 'number-word' 'Fails: the edit changed a protected item.'; do
            grep -qF "$wanted" "$RUNNER_TEMP/dom.html" || {
              echo "::error::The page did not show '$wanted'"
              exit 1
            }
          done
      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: ${{ runner.temp }}/site

  # Whether GitHub Pages is on; turning it on is a repository setting.
  pages-enabled:
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      pages: read
    outputs:
      enabled: ${{ steps.check.outputs.enabled }}
    steps:
      - id: check
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh api "repos/${GITHUB_REPOSITORY}/pages" > /dev/null; then
            echo "enabled=true" >> "$GITHUB_OUTPUT"
          else
            echo "::notice::GitHub Pages is off, so the page is built and tested but not published."
            echo "enabled=false" >> "$GITHUB_OUTPUT"
          fi

  publish:
    needs: [build, pages-enabled]
    if: needs.pages-enabled.outputs.enabled == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - id: deploy
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
