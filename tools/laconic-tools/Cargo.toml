[package]
name = "laconic-tools"
version = "0.1.0"
edition = "2024"
license = "FSL-1.1-ALv2"
description = "Maintainer tooling for Laconic: syncs the compact rules into INSTALL.md, smoke-tests the Pi package, regenerates the US word list, writes release package manifests and measures the rules on an outside corpus."
publish = false

[dependencies]
laconic-check = { path = "../laconic-check" }
serde_json = "1"

# The contract tests use the Python suite's regular expressions unchanged.
[dev-dependencies]
regex = "1"
