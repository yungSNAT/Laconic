[package]
name = "laconic-web"
version = "0.1.0"
edition = "2024"
rust-version = "1.100"
license = "Apache-2.0"
description = "laconic-check's lint and preserve compiled to WebAssembly for the browser page in web/."
publish = false

[lib]
crate-type = ["cdylib"]

[dependencies]
laconic-check = { path = "../laconic-check" }

[profile.release]
lto = true
codegen-units = 1
opt-level = "s"
